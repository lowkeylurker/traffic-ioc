services:
  # 1. Database với PostGIS (Trái tim dữ liệu địa lý)
  postgres:
    image: pgrouting/pgrouting:15-3.5-4.0.1
    container_name: traffic_ioc_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-traffic_ioc_db}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ./infrastructure/postgres/1_init_extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./infrastructure/postgres/2_create_dims.sql:/docker-entrypoint-initdb.d/02-dims.sql
      - ./infrastructure/postgres/3_create_facts.sql:/docker-entrypoint-initdb.d/03-facts.sql
      - ./infrastructure/postgres/4_indexes.sql:/docker-entrypoint-initdb.d/04-indexes.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-network

  # 2. Data-Pipeline (Tầng ETL & API tích hợp nguồn dữ liệu)
  data-pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile
    container_name: utraffic-data-pipeline
    volumes:
      - ./data-pipeline:/app
    # Đổi sang cổng 8001 để không trùng với ai-core
    ports:
      - "8001:8000"
    # CLI container – giữ sống, exec ETL commands vào:
    #   docker-compose exec data-pipeline python -m src.main run-all
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - ./data-pipeline/.env
    depends_on:
      postgres:
        condition: service_healthy # Chỉ chạy khi DB đã thực sự sẵn sàng
    networks:
      - traffic-network

  # 3. AI-Core (Tầng xử lý ML & Giả lập CityFlow)
  ai-core:
    build:
      context: ./ai-core
    container_name: utraffic-ai-core
    volumes:
      - ./ai-core:/app
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    env_file:
      - ./ai-core/.env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - traffic-network

  # 4. Redis (Bộ nhớ đệm cho Real-time traffic)
  redis:
    image: redis:7-alpine
    container_name: traffic_ioc_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-network

volumes:
  postgres_data:
  redis_data:

networks:
  traffic-network:
    driver: bridge