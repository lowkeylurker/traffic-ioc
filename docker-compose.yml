# ═══════════════════════════════════════════════════════════════════════════
# Traffic IoC - Unified Docker Compose Configuration
#
# 🎯 Auto-start Mode: Core services + ETL Scheduler (Production Ready)
# 📊 When Docker Desktop opens, these services start automatically:
#    ✅ postgres       - Data warehouse (always running)
#    ✅ data-pipeline  - ETL container (always running) 
#    ✅ etl-scheduler  - Automated ETL jobs (always running)
#    ✅ ai-core        - ML/AI service
#
# 🔧 Optional Services (use profiles):
#    - backend/frontend: --profile fullstack
#    - redis: --profile with-redis
#
# 📝 Usage:
#    docker-compose up -d                        # Core + Scheduler (auto-start)
#    docker-compose --profile fullstack up -d    # Include backend/frontend
#    docker-compose logs -f etl-scheduler        # Watch scheduler logs
#    docker-compose exec data-pipeline python -m src.main run-realtime  # Manual trigger
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ═══════════════════════════════════════════════════════════
  # CORE SERVICES (Always running when Docker Desktop starts)
  # ═══════════════════════════════════════════════════════════

  # 1. PostgreSQL 15 with PostGIS + pgRouting - Data Warehouse
  postgres:
    image: pgrouting/pgrouting:15-3.5-4.0.1
    container_name: traffic_ioc_postgres
    command: ["postgres", "-c", "timezone=Asia/Ho_Chi_Minh"]
    environment:
      POSTGRES_USER: ${DB_USER:-traffic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-traffic_password}
      POSTGRES_DB: ${DB_NAME:-traffic_ioc}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ./infrastructure/postgres/1_init_extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./infrastructure/postgres/2_create_dims.sql:/docker-entrypoint-initdb.d/02-dims.sql
      - ./infrastructure/postgres/3_create_facts.sql:/docker-entrypoint-initdb.d/03-facts.sql
      - ./infrastructure/postgres/4_indexes.sql:/docker-entrypoint-initdb.d/04-indexes.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-traffic_user} -d ${DB_NAME:-traffic_ioc}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-network
    restart: always  # 🔄 Auto-restart when Docker Desktop starts

  # 2. Data Pipeline - ETL Container (Required for scheduler)
  data-pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile
    container_name: data-pipeline
    volumes:
      - ./data-pipeline:/app
      - pipeline_logs:/app/logs
    # Keep container alive for scheduler to exec commands
    command: ["tail", "-f", "/dev/null"]
    environment:
      - DB_CONNECTION_STRING=postgresql://${DB_USER:-traffic_user}:${DB_PASSWORD:-traffic_password}@postgres:5432/${DB_NAME:-traffic_ioc}
      - LOG_LEVEL=INFO
      - TZ=Asia/Ho_Chi_Minh
      - OWM_GRID_SIZE_M=${OWM_GRID_SIZE_M:-500}
      - OWM_GRID_MIN_CALL_INTERVAL_SEC=${OWM_GRID_MIN_CALL_INTERVAL_SEC:-0.9}
      - PCU_BPR_ALPHA=${PCU_BPR_ALPHA:-0.35}
      - PCU_BPR_BETA=${PCU_BPR_BETA:-4.0}
      - PCU_MAX_VC_RATIO=${PCU_MAX_VC_RATIO:-1.0}
    env_file:
      - ./data-pipeline/.env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traffic-network
    restart: always  # 🔄 Auto-restart when Docker Desktop starts

  # 3. ETL Scheduler - Automated Job Execution
  etl-scheduler:
    build:
      context: ./data-pipeline/scheduler
      dockerfile: Dockerfile
    container_name: etl-scheduler
    env_file:
      - ./data-pipeline/.env
    environment:
      - DB_CONNECTION_STRING=postgresql://${DB_USER:-traffic_user}:${DB_PASSWORD:-traffic_password}@postgres:5432/${DB_NAME:-traffic_ioc}
      - LOG_LEVEL=INFO
      - TZ=Asia/Ho_Chi_Minh
    volumes:
      - pipeline_logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # Access Docker to exec into data-pipeline
    depends_on:
      postgres:
        condition: service_healthy
      data-pipeline:
        condition: service_started
    networks:
      - traffic-network
    restart: always  # 🔄 Auto-restart when Docker Desktop starts
    # Resource limits (optional)
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '1'
    #       memory: 1G

  # 4. AI-Core - ML/Forecasting Service
  ai-core:
    build:
      context: ./ai-core
      dockerfile: Dockerfile
      args:
        INSTALL_ML: "true"
    container_name: ai-core
    volumes:
      - ./ai-core:/app
      - ./ai-core/models:/app/models
      - ./ai-core/cache:/app/cache
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 5000 --reload
    environment:
      - PORT=5000
      - LOG_LEVEL=INFO
    env_file:
      - ./ai-core/.env
    ports:
      - "${AI_SERVICE_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traffic-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ═══════════════════════════════════════════════════════════
  # OPTIONAL SERVICES (Use --profile to enable)
  # ═══════════════════════════════════════════════════════════

  # 5. Backend API - Express.js Server
  backend:
    profiles: ["fullstack"]
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: backend-api
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${DB_USER:-traffic_user}:${DB_PASSWORD:-traffic_password}@postgres:5432/${DB_NAME:-traffic_ioc}
      - API_PORT=3000
      - AI_CORE_URL=http://ai-core:5000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - traffic-network
    restart: unless-stopped

  # 6. Admin Web Portal - React + Vite + AntD
  admin-web:
    profiles: ["fullstack"]
    build:
      context: ./apps/admin-web
      dockerfile: Dockerfile
    container_name: admin-web-app
    environment:
      - VITE_API_URL=http://localhost:3000
      - VITE_AI_CORE_URL=http://localhost:5000
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - traffic-network
    restart: unless-stopped

  # 7. User Web Portal - Next.js App Router
  user-web:
    profiles: ["fullstack"]
    build:
      context: ./apps/user-web
      dockerfile: Dockerfile
    container_name: user-web-app
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000
    ports:
      - "3001:3000"
    depends_on:
      - backend
    networks:
      - traffic-network
    restart: unless-stopped

  # 7. Redis - Caching Layer (Optional)
  redis:
    profiles: ["with-redis"]
    image: redis:7-alpine
    container_name: traffic_ioc_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  # 8. Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: traffic_ioc_qdrant
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - traffic-network
    restart: unless-stopped

  # 9. PostgreSQL 15 - Operational OLTP Database (RAG, Chat, Feedback)
  postgres-oltp:
    image: postgres:15-alpine
    container_name: traffic_ioc_postgres_oltp
    environment:
      POSTGRES_USER: ${OLTP_DB_USER:-traffic_user}
      POSTGRES_PASSWORD: ${OLTP_DB_PASSWORD:-traffic_password}
      POSTGRES_DB: ${OLTP_DB_NAME:-traffic_ioc_oltp}
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "${OLTP_DB_PORT:-5434}:5432"
    volumes:
      - postgres_oltp_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_DB_USER:-traffic_user} -d ${OLTP_DB_NAME:-traffic_ioc_oltp}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-network
    restart: unless-stopped

# ═══════════════════════════════════════════════════════════
# Persistent Volumes
# ═══════════════════════════════════════════════════════════

volumes:
  postgres_data:
    driver: local
  pipeline_logs:
    driver: local
  redis_data:
    driver: local
  postgres_oltp_data:
    driver: local
  qdrant_data:
    driver: local

# ═══════════════════════════════════════════════════════════
# Networks
# ═══════════════════════════════════════════════════════════

networks:
  traffic-network:
    driver: bridge