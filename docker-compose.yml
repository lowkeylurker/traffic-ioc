services:
  # 1. Database với PostGIS (Trái tim dữ liệu địa lý)
  postgres:
    image: pgrouting/pgrouting:15-3.5-4.0.1
    container_name: traffic_ioc_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-traffic_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-traffic_password}
      POSTGRES_DB: ${DB_NAME:-traffic_ioc}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - ./infrastructure/postgres/1_init_extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql
      - ./infrastructure/postgres/2_create_dims.sql:/docker-entrypoint-initdb.d/02-dims.sql
      - ./infrastructure/postgres/3_create_facts.sql:/docker-entrypoint-initdb.d/03-facts.sql
      - ./infrastructure/postgres/4_indexes.sql:/docker-entrypoint-initdb.d/04-indexes.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-traffic_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-network

  # 2. Data-Pipeline (Tầng ETL & API tích hợp nguồn dữ liệu)
  data-pipeline:
    build:
      context: ./data-pipeline
      dockerfile: Dockerfile
    container_name: utraffic-data-pipeline
    volumes:
      - ./data-pipeline:/app
    # Đổi sang cổng 8001 để không trùng với ai-core
    ports:
      - "8001:8000"
    # CLI container – giữ sống, exec ETL commands vào:
    #   docker-compose exec data-pipeline python -m src.main run-all
    command: ["tail", "-f", "/dev/null"]
    env_file:
      - ./data-pipeline/.env
    depends_on:
      postgres:
        condition: service_healthy # Chỉ chạy khi DB đã thực sự sẵn sàng
    networks:
      - traffic-network

  # 3. AI-Core (Tầng xử lý ML - Dự báo giao thông, Dự báo tắc nghẽn, Data Imputation)
  ai-core:
    build:
      context: ./ai-core
      dockerfile: Dockerfile
    container_name: utraffic-ai-core
    volumes:
      - ./ai-core:/app
      - ./ai-core/models:/app/models  # Persist trained models
    # Chạy FastAPI server (src.api.app:app)
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 5000 --reload
    env_file:
      - ./ai-core/.env
    ports:
      - "${AI_SERVICE_PORT:-5000}:5000"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Override từ .env file, ưu tiên ENV vars
      DB_HOST: ${DB_HOST:-postgres}
      DB_PORT: ${DB_PORT:-5432}
      DB_USER: ${DB_USER:-traffic_user}
      DB_PASSWORD: ${DB_PASSWORD:-traffic_password}
      DB_NAME: ${DB_NAME:-traffic_ioc}
      DB_SCHEMA: ${DB_SCHEMA:-public}
    networks:
      - traffic-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health-check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # 4. Redis (Bộ nhớ đệm cho Real-time traffic - Optional)
  redis:
    image: redis:7-alpine
    container_name: traffic_ioc_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - traffic-network
    # Optional: chỉ bật khi cần caching
    profiles:
      - with-redis

volumes:
  postgres_data:
  redis_data:
    driver: local

networks:
  traffic-network:
    driver: bridge