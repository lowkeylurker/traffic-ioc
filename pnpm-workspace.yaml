packages:
  - 'apps/*'
  - 'packages/*'

allowBuilds:
  '@clerk/shared': true
  '@prisma/client': true
  '@prisma/engines': true
  '@sentry/node-cpu-profiler': true
  core-js: true
  esbuild: true
  msgpackr-extract: true
  prisma: true
  unrs-resolver: true

onlyBuiltDependencies:
  - '@clerk/shared'
  - '@prisma/client'
  - '@prisma/engines'
  - '@sentry/node-cpu-profiler'
  - 'core-js'
  - 'esbuild'
  - 'msgpackr-extract'
  - 'prisma'
  - 'unrs-resolver'
